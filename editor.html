<!DOCTYPE html>
<html>
<head>
    <title>WYSIWYG PDF Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #e0e0e0; margin: 0; padding: 20px; }
        .toolbar { margin-bottom: 15px; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #pdf-container { position: relative; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.2); background: white; }
        canvas { display: block; }
        .text-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        
        /* Teks transparan menutupi teks asli PDF */
        .pdf-text {
            position: absolute;
            color: transparent; 
            cursor: text;
            pointer-events: auto;
            white-space: pre;
            transform-origin: left bottom;
            border-radius: 2px;
        }
        /* Saat kursor diarahkan, beri garis batas agar user tahu itu bisa diklik */
        .pdf-text:hover {
            border: 1px dashed rgba(0, 120, 255, 0.4);
            background: rgba(255,255,255,0.2);
        }
        /* Saat user sedang mengetik/edit */
        .pdf-text.editing, .pdf-text.edited {
            color: black;
            background: white;
            outline: 2px solid #0078d7;
            border: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <input type="file" id="upload" accept="application/pdf">
        <button id="save" style="display:none; padding: 5px 15px; background: #0078d7; color: white; border: none; border-radius: 4px; cursor: pointer;">Save PDF</button>
        <span style="margin-left: 10px; font-size: 14px; color: #555;">* Arahkan kursor ke teks, <b>klik teksnya</b> untuk mengedit langsung di tempat.</span>
    </div>
    
    <div id="pdf-container" style="display:none;">
        <canvas id="pdf-canvas"></canvas>
        <div id="text-layer" class="text-layer"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        let pdfBytes = null;
        let pdfDoc = null;
        let viewport = null;

        const upload = document.getElementById('upload');
        const saveBtn = document.getElementById('save');
        const container = document.getElementById('pdf-container');
        const canvas = document.getElementById('pdf-canvas');
        const textLayer = document.getElementById('text-layer');
        const ctx = canvas.getContext('2d');

        upload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            pdfBytes = await file.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({data: pdfBytes});
            pdfDoc = await loadingTask.promise;
            const page = await pdfDoc.getPage(1);
            
            viewport = page.getViewport({scale: 1.5});
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            // Render Background Image
            await page.render({canvasContext: ctx, viewport: viewport}).promise;
            
            // Ekstrak Teks untuk Layer Interaktif
            const textContent = await page.getTextContent();
            textLayer.innerHTML = '';
            
            textContent.items.forEach(item => {
                if (!item.str.trim()) return; // Abaikan spasi kosong

                const div = document.createElement('div');
                div.className = 'pdf-text';
                div.innerText = item.str;
                
                // Simpan koordinat asli PDF (untuk proses Save)
                div.dataset.orig = item.str;
                div.dataset.x = item.transform[4];
                div.dataset.y = item.transform[5];
                div.dataset.w = item.width;
                div.dataset.h = item.height;
                div.dataset.sz = item.transform[0]; // Ukuran font asli
                
                // Konversi koordinat asli ke koordinat layar browser
                const [x, y] = viewport.convertToViewportPoint(item.transform[4], item.transform[5]);
                const fontSize = item.transform[0] * viewport.scale;
                
                div.style.left = x + 'px';
                // y adalah baseline (garis bawah huruf), kurangi font-size agar sejajar
                div.style.top = (y - fontSize) + 'px'; 
                div.style.fontSize = fontSize + 'px';
                div.style.fontFamily = item.fontName || 'sans-serif';
                
                // Event Edit
                div.onclick = () => {
                    div.contentEditable = true;
                    div.classList.add('editing');
                    div.focus();
                };
                
                div.onblur = () => {
                    div.contentEditable = false;
                    div.classList.remove('editing');
                    if (div.innerText !== div.dataset.orig) {
                        div.classList.add('edited'); // Tetap hitam/putih jika sudah diubah
                    } else {
                        div.classList.remove('edited');
                    }
                };
                
                textLayer.appendChild(div);
            });

            container.style.display = 'inline-block';
            saveBtn.style.display = 'inline-block';
        });

        saveBtn.addEventListener('click', async () => {
            const { PDFDocument, rgb } = PDFLib;
            const doc = await PDFDocument.load(pdfBytes);
            const pages = doc.getPages();
            const firstPage = pages[0];

            // Cari semua teks yang telah diubah oleh user
            const nodes = document.querySelectorAll('.pdf-text.edited');
            nodes.forEach(node => {
                const newText = node.innerText;
                const pdfX = parseFloat(node.dataset.x);
                const pdfY = parseFloat(node.dataset.y);
                const pdfW = parseFloat(node.dataset.w);
                const pdfSz = parseFloat(node.dataset.sz);
                
                // 1. Tipe-x (Kotak Putih) di atas teks lama
                firstPage.drawRectangle({
                    x: pdfX, 
                    y: pdfY - (pdfSz * 0.2), // Turunkan sedikit untuk baseline
                    width: Math.max(pdfW, newText.length * (pdfSz * 0.5)), // Lebar dinamis
                    height: pdfSz * 1.2,
                    color: rgb(1, 1, 1)
                });

                // 2. Tulis teks baru di posisi yang sama persis
                firstPage.drawText(newText, {
                    x: pdfX,
                    y: pdfY,
                    size: pdfSz,
                    color: rgb(0, 0, 0)
                });
            });

            const savedBytes = await doc.save();
            const blob = new Blob([savedBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'edited.pdf';
            a.click();
        });
    </script>
</body>
</html>
